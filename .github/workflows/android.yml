name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7 (fallback if wrapper is missing)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug and Release APKs
        run: |
          chmod +x gradlew || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew --no-daemon assembleDebug assembleRelease
          else
            gradle --no-daemon assembleDebug assembleRelease
          fi

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk   dist/MachinistAssistant-v1.0.0-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/MachinistAssistant-v1.0.0-release.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachinistAssistant-debug-apk
          path: dist/MachinistAssistant-v1.0.0-debug.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachinistAssistant-release-apk
          path: dist/MachinistAssistant-v1.0.0-release.apk

      - name: Create GitHub Release (only when pushing a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
